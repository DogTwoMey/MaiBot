[system_guidance]
display_name = "システムガイダンス"
advanced = false
description = "Maisaka の Planner、Replyer、および関連サブフローで共有するシステム級の基本ルール。人物設定、チャット、返信テンプレートに散らばりがちな汎用制約を集中管理する。"

[maisaka_chat_merged_timing]
display_name = "Planner（タイミング統合）"
advanced = false
description = "独立したタイミング判断を使わない場合の Maisaka メイン計画テンプレート。発話タイミングの判断を Planner に統合する。"

[default_expressor]
display_name = "既定表現器"
advanced = true
description = "表現方式の生成と整理に関するテンプレート。通常は表現システムのデバッグ時だけ編集する。"

[expression_select]
display_name = "表現選択"
advanced = true
description = "表現ライブラリから適切な表現方式を選択するためのテンプレート。"

[jargon_explainer_summarize]
display_name = "隠語説明要約"
advanced = true
description = "隠語説明の結果を要約するためのテンプレート。"

[maisaka_chat_optimized]
display_name = "Planner（最適化版）"
advanced = true
description = "実験機能 experimental.planner_optimized_prompt を有効にしたときに使う Maisaka メイン計画テンプレート。ボット自身を二人称で記述し、タスク説明を簡潔にしている。Focus モードでは引き続き Focus Planner を使う。"

[memory_retrieval_react_prompt_head_memory]
display_name = "記憶検索 ReAct ヘッダー"
advanced = true
description = "ReAct 形式の記憶検索フローで使用する高度な記憶検索プロンプトのヘッダー。"
