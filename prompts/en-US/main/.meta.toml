[maisaka_chat_merged_timing]
display_name = "Planner (Timing merged)"
advanced = false
description = "Main Maisaka planning template used when independent timing awareness is disabled, with timing decisions merged into the planner."

[default_expressor]
display_name = "Default Expressor"
advanced = true
description = "Template for expression generation and cleanup, usually only edited while debugging the expression system."

[expression_select]
display_name = "Expression Selection"
advanced = true
description = "Template for selecting a suitable expression from the expression library."

[jargon_explainer_summarize]
display_name = "Jargon Explanation Summary"
advanced = true
description = "Template for summarizing jargon explanation results."

[maisaka_chat_optimized]
display_name = "Planner (Optimized)"
advanced = true
description = "Main Maisaka planning template used when the experimental feature experimental.planner_optimized_prompt is enabled. It addresses the bot in the second person and trims the task description; Focus mode keeps using the Focus planner."

[memory_retrieval_react_prompt_head_memory]
display_name = "Memory Retrieval ReAct Header"
advanced = true
description = "Advanced memory retrieval prompt header used by the ReAct-style memory query flow."
